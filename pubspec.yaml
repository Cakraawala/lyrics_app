name: lyricsme
description: "LyricsMe App - offline personal lyrics notebook"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.5+1
  # Local storage (pure Dart, works on mobile, desktop and web)
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  # UI
  google_fonts: ^8.0.0 # v9 targets the decoupled material_ui package
  flutter_svg: ^2.3.3
  cupertino_icons: ^1.0.8
  # Import / export
  file_picker: ^13.3.3
  share_plus: ^13.3.1
  path_provider: ^2.1.6
  archive: ^4.6.0
  # Utilities
  uuid: ^4.6.0
  intl: ^0.20.3
  package_info_plus: ^10.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo.svg

# Generate launcher icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#101014"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#101014"
    theme_color: "#101014"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
